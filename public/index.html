<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout B2B - Seminário de Testes</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 20px; background: #f8fafc; }
    .card { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    label { display: block; margin-top: 12px; font-weight: 600; font-size: 14px; }
    input, select, button { width: 100%; padding: 10px; margin-top: 6px; box-sizing: border-box; border-radius: 6px; border: 1px solid #cbd5e1; }
    button { background: #2563eb; color: white; font-weight: 600; border: none; margin-top: 18px; cursor: pointer; }
    .alert-error { background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 6px; margin-top: 16px; display: none; }
    .alert-success { background: #dcfce7; color: #166534; padding: 12px; border-radius: 6px; margin-top: 16px; display: none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Novo Pedido B2B</h1>
    <form id="order-form">
      <label for="customer">Cliente</label>
      <input id="customer" type="text" data-cy="input-customer" placeholder="Ex: Empresa Alpha" />

      <label for="product">Produto</label>
      <select id="product" data-cy="select-product">
        <option value="prod-1">Teclado Mecânico Brown (R$ 250,00)</option>
        <option value="prod-2">Monitor Ultrawide 29" (R$ 1200,00)</option>
      </select>

      <label for="quantity">Quantidade</label>
      <input id="quantity" type="number" data-cy="input-quantity" value="1" min="1" />

      <label for="coupon">Cupom de Desconto (Opcional)</label>
      <input id="coupon" type="text" data-cy="input-coupon" placeholder="Ex: PROMO15" />

      <button type="submit" data-cy="btn-submit">Finalizar Pedido</button>
    </form>

    <div id="error-box" class="alert-error" data-cy="alert-error" role="alert"></div>
    <div id="success-box" class="alert-success" data-cy="alert-success" role="status"></div>
  </main>

  <script>
    const form = document.getElementById('order-form');
    const errorBox = document.getElementById('error-box');
    const successBox = document.getElementById('success-box');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.style.display = 'none';
      successBox.style.display = 'none';

      const payload = {
        customerName: document.querySelector('[data-cy="input-customer"]').value,
        productId: document.querySelector('[data-cy="select-product"]').value,
        quantity: Number(document.querySelector('[data-cy="input-quantity"]').value),
        coupon: document.querySelector('[data-cy="input-coupon"]').value.trim()
      };

      try {
        const response = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await response.json();

        if (!response.ok) {
          errorBox.textContent = data.error || 'Erro interno no servidor ao processar pedido';
          errorBox.style.display = 'block';
          return;
        }

        successBox.innerHTML = `
          <strong>Pedido #${data.order.id} confirmado!</strong><br />
          Subtotal: R$ ${data.calculation.subtotal.toFixed(2)} |
          Desconto: R$ ${data.calculation.discount.toFixed(2)} |
          Frete: R$ ${data.calculation.shipping.toFixed(2)}<br />
          <strong>Total Final: R$ ${data.calculation.total.toFixed(2)}</strong>
        `;
        successBox.style.display = 'block';
      } catch {
        errorBox.textContent = 'Falha de comunicação com o servidor';
        errorBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
